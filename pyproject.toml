[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "maintidoc"
version = "0.1.0"
description = "RAG multimodal agentique pour interroger des PDF avec Ollama, CLIP et Qdrant"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "langchain>=1.0,<2",
  "langchain-ollama>=1.0,<2",
  "llama-index-core>=0.12,<1",
  "llama-index-readers-file>=0.4,<1",
  "numpy>=1.26,<3",
  "pdfplumber>=0.11,<1",
  "pillow>=10,<13",
  "pydantic>=2.9,<3",
  "pymupdf>=1.24,<2",
  "python-dotenv>=1.0,<2",
  "qdrant-client>=1.12,<2",
  "requests>=2.32,<3",
  "streamlit>=1.40,<2",
  "torch>=2.2,<3",
  "transformers>=4.46,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[project.scripts]
maintidoc-index = "maintidoc.cli:index_main"
maintidoc-ask = "maintidoc.cli:ask_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Les frontières Streamlit et le captioner doivent transformer toute erreur externe
# (Ollama, Qdrant, modèle, fichier) en message utilisateur au lieu de faire tomber l'app.
ignore = ["BLE001"]

